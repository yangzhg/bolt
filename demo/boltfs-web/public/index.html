<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BoltFS Web Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="hero">
        <p class="eyebrow">BoltFS Live Demo</p>
        <h1>BoltFS Live Shell</h1>
        <p class="subtitle">
          A browser REPL for filesystem-style data access on Bolt. Open the
          page and start exploring data as if it were a local workspace.
        </p>
        <div class="meta-grid">
          <div class="meta-card meta-card-status">
            <span id="status-dot" class="status-dot"></span>
            <div class="meta-copy">
              <span class="meta-label">Status</span>
              <span id="status-text" class="meta-value">Connecting...</span>
            </div>
          </div>
          <div class="meta-card">
            <div class="meta-copy">
              <span class="meta-label">Session</span>
              <span id="session-id" class="meta-value">Pending</span>
            </div>
          </div>
          <div class="meta-card">
            <div class="meta-copy">
              <span class="meta-label">Idle Timeout</span>
              <span id="idle-timeout" class="meta-value">10m</span>
            </div>
          </div>
        </div>
      </section>
      <section class="terminal-card">
        <div id="terminal"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
